<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T3D — 3D 编辑器</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #1a1a1a; color: #c8c8c8; }
      body { font-family: "Segoe UI", sans-serif; }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1a1a1a;
        transition: opacity 180ms ease;
      }
      .boot-splash--hide { opacity: 0; pointer-events: none; }
      .boot-splash__title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: #4a9eff;
      }
      .boot-splash__label { font-size: 12px; color: #8d8d8d; }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status">
      <div class="boot-splash__title">T3D</div>
      <div class="boot-splash__label">正在打开编辑器…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
